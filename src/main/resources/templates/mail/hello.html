<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Notificación</title>
    <style>
        .card { max-width: 560px; margin: auto; border: 1px solid #eee; border-radius: 10px; padding: 20px; font-family: Arial, sans-serif; }
        .title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .small { color: #666; font-size: 12px; }
        .btn { display: inline-block; padding: 10px 16px; text-decoration: none; border-radius: 6px; background: #0d6efd; color: #fff; }
    </style>
</head>
<body>
<div class="card">
    <div class="title">Hola, <span th:text="${nombre}">Usuario</span> 👋</div>
    <p th:text="${mensaje}">Este es un ejemplo de correo con plantilla.</p>
    <p th:utext="${mensageTwo}">Este es un ejemplo de correo con plantilla.</p>
    <p class="small">Enviado por DataRegister • No responder a este correo.</p>
    <a class="btn" style="color:#ffffff" th:href="${ctaUrl}">Ir a la app</a>
</div>
</body>
</html>
